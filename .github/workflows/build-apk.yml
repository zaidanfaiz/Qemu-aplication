name: Native Android Prototype CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qemu-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK and install API 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --list_installed | head -45
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install native Android toolchain
        if: github.ref == 'refs/heads/main'
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test Android ROM ISO/disk image detection
        run: |
          mkdir -p "$RUNNER_TEMP/rom-tests"
          javac -d "$RUNNER_TEMP/rom-tests" \
            app/src/main/java/dev/zaidan/qemu/RomImageInspector.java \
            scripts/qemu-lab/RomImageInspectorTest.java
          java -cp "$RUNNER_TEMP/rom-tests" dev.zaidan.qemu.RomImageInspectorTest
      - name: Test ISO keyboard and touchscreen detection
        run: |
          mkdir -p "$RUNNER_TEMP/iso-tests"
          javac -d "$RUNNER_TEMP/iso-tests" \
            app/src/main/java/dev/zaidan/qemu/IsoInputDetector.java \
            scripts/qemu-lab/IsoInputDetectorTest.java
          java -cp "$RUNNER_TEMP/iso-tests" dev.zaidan.qemu.IsoInputDetectorTest
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Check native library packaging
        if: github.ref == 'refs/heads/native-qemu'
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/libqemu_bridge.so'
          if unzip -l "$APK" | grep -E 'lib/arm64-v8a/libqemu-system-(x86_64|aarch64).so'; then
            echo "Native QEMU library detected; physical-device boot testing is still required."
          else
            echo "::warning::JNI bridge compiled; QEMU core is NOT bundled yet. APK cannot boot guests."
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NativeBridge-Prototype-NOT-QEMU
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
