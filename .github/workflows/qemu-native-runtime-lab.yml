name: QEMU Android Native Dependency Integration Lab

# Full dependency-closure and firmware packaging. NOT a guest boot test.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qemu-native-runtime-lab.yml'
      - 'scripts/qemu-lab/bundle_termux_closure.py'
      - 'scripts/qemu-lab/rewrite_elf_inplace.py'
      - 'app/src/main/java/dev/zaidan/qemu/NativeFirmware.java'
      - 'app/src/main/java/dev/zaidan/qemu/MainActivity.java'
      - 'app/src/main/java/dev/zaidan/qemu/RomImageInspector.java'
      - 'scripts/qemu-lab/RomImageInspectorTest.java'
      - 'app/src/main/java/dev/zaidan/qemu/IsoInputDetector.java'
      - 'scripts/qemu-lab/IsoInputDetectorTest.java'
      - 'app/src/main/java/dev/zaidan/qemu/ViewerActivity.java'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'app/src/main/java/dev/zaidan/qemu/NativeVmService.java'
  workflow_dispatch:
    inputs:
      minimal_run_id:
        description: 'Successful minimal QEMU 11.1.2 run with 10 direct ELF dependencies'
        required: true
        default: '40452362228'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: qemu-native-dependency-integration
  cancel-in-progress: true

jobs:
  build-runtime-apk:
    name: Audit and bundle transitive QEMU ARM64 dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4
      - name: Install Python and ELF manipulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 patchelf binutils dpkg xz-utils file
          python3 -m py_compile scripts/qemu-lab/stage_qemu_executables.py \
            scripts/qemu-lab/bundle_termux_closure.py \
            scripts/qemu-lab/rewrite_elf_inplace.py
      - name: Download actual QEMU 11.1.2 Android ARM64 minimal binary
        uses: actions/download-artifact@v4
        with:
          name: qemu-android-arm64-minimal-DEPENDENCY-LAB
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.minimal_run_id || '40452362228' }}
          github-token: ${{ github.token }}
          path: input-runtime
      - name: Verify upstream cross-build and unpack ROM data
        run: |
          set -euo pipefail
          (cd input-runtime && sha256sum -c qemu-android-arm64-minimal-v11.1.2.tar.gz.sha256)
          tar -xzf input-runtime/qemu-android-arm64-minimal-v11.1.2.tar.gz \
            -C input-runtime
          ROMS=input-runtime/qemu-android-minimal/extracted/data/data/com.termux/files/usr/share/qemu
          test -s "$ROMS/bios-256k.bin"
          test -s "$ROMS/bios.bin"
          test -s "$ROMS/vgabios-stdvga.bin"
          # VNC keyboard layouts live under share/qemu/keymaps, not the flat ROM list.
          test -s "$ROMS/keymaps/en-us"
          test -f "$ROMS/edk2-aarch64-code.fd"
          mkdir -p app/src/main/assets/qemu-roms native-runtime-audit
          # Copy all ROMs needed by basic PC/virt machines, not just legacy bios.bin.
          # QEMU 11.1.2's pc machine defaults to bios-256k.bin (SeaBIOS).
          for firmware in bios-256k.bin bios.bin bios-microvm.bin \
                          vgabios.bin vgabios-stdvga.bin vgabios-ramfb.bin \
                          vgabios-cirrus.bin vgabios-virtio.bin vgabios-bochs-display.bin \
                          kvmvapic.bin pvh.bin linuxboot_dma.bin multiboot_dma.bin \
                          efi-virtio.rom pxe-virtio.rom \
                          edk2-aarch64-code.fd edk2-x86_64-code.fd edk2-licenses.txt; do
            if test -f "$ROMS/$firmware"; then
              cp "$ROMS/$firmware" "app/src/main/assets/qemu-roms/$firmware"
            fi
          done
          # Preserve the QEMU directory layout: -L <firmware> resolves keymaps/en-us.
          # Include all upstream keymaps to support other guest keyboard layouts.
          mkdir -p app/src/main/assets/qemu-roms/keymaps
          cp -a "$ROMS/keymaps/." app/src/main/assets/qemu-roms/keymaps/
          test -s app/src/main/assets/qemu-roms/keymaps/en-us
          # Do not publish an APK that cannot satisfy the default x86 PC firmware.
          test -s app/src/main/assets/qemu-roms/bios-256k.bin
          test "$(stat -c %s app/src/main/assets/qemu-roms/bios-256k.bin)" -eq 262144
          test -s app/src/main/assets/qemu-roms/vgabios-stdvga.bin
          # Recursive manifest includes keymaps/ files; sha256sum * cannot handle dirs.
          (cd app/src/main/assets/qemu-roms &&
            find . -type f ! -name FIRMWARE-SHA256SUMS -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > "$GITHUB_WORKSPACE/native-runtime-audit/FIRMWARE-SHA256SUMS")
          # Small manifest lets Android skip repeatedly extracting large EDK2 assets.
          cp native-runtime-audit/FIRMWARE-SHA256SUMS \
            app/src/main/assets/qemu-roms/FIRMWARE-SHA256SUMS
      - name: Stage upstream Android PIE executables
        run: |
          python3 scripts/qemu-lab/stage_qemu_executables.py \
            input-runtime/qemu-android-minimal \
            app/src/main/jniLibs/arm64-v8a
      - name: Download verified Termux ARM64 library packages, close DT_NEEDED, relocate RUNPATH
        run: |
          python3 scripts/qemu-lab/bundle_termux_closure.py \
            input-runtime/qemu-android-minimal \
            app/src/main/jniLibs/arm64-v8a \
            native-runtime-audit
      - name: Assert original ELF program headers and dynstr remain untouched
        run: |
          set -euo pipefail
          before=input-runtime/qemu-android-minimal/extracted/data/data/com.termux/files/usr/bin
          after=app/src/main/jniLibs/arm64-v8a
          for arch in aarch64 x86_64; do
            input="$before/qemu-system-$arch"
            output="$after/libqemu-system-$arch.so"
            test -s "$input" && test -s "$output"
            diff -u <(readelf -Wl "$input") <(readelf -Wl "$output")
            original=$(readelf -d "$input" | grep -E '\(STRTAB\)|\(STRSZ\)')
            updated=$(readelf -d "$output" | grep -E '\(STRTAB\)|\(STRSZ\)')
            if [[ "$original" != "$updated" ]]; then
              echo "::error::Dynamic string table moved in $arch; potential Android linker failure"
              exit 1
            fi
            readelf -d "$output" | grep 'Library runpath: \[\$ORIGIN\]'
            echo "ELF layout preserved for QEMU $arch"
          done
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build SDK/NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Test Android ROM ISO/disk image detection
        run: |
          mkdir -p "$RUNNER_TEMP/rom-tests"
          javac -d "$RUNNER_TEMP/rom-tests" \
            app/src/main/java/dev/zaidan/qemu/RomImageInspector.java \
            scripts/qemu-lab/RomImageInspectorTest.java
          java -cp "$RUNNER_TEMP/rom-tests" dev.zaidan.qemu.RomImageInspectorTest
      - name: Test ISO keyboard and touchscreen detection
        run: |
          mkdir -p "$RUNNER_TEMP/iso-tests"
          javac -d "$RUNNER_TEMP/iso-tests" \
            app/src/main/java/dev/zaidan/qemu/IsoInputDetector.java \
            scripts/qemu-lab/IsoInputDetectorTest.java
          java -cp "$RUNNER_TEMP/iso-tests" dev.zaidan.qemu.IsoInputDetectorTest
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android native runtime test APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify packaged ELF closure and ROM assets
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libqemu-system-aarch64.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libqemu-system-x86_64.so'
          unzip -l "$APK" | grep -F 'assets/qemu-roms/keymaps/en-us'
          unzip -l "$APK" | grep -F 'assets/qemu-roms/bios-256k.bin'
          unzip -l "$APK" | grep -F 'assets/qemu-roms/vgabios-stdvga.bin'
          unzip -l "$APK" | grep -F 'assets/qemu-roms/bios.bin'
          unzip -l "$APK" | grep -F 'assets/qemu-roms/edk2-aarch64-code.fd'
          cat native-runtime-audit/CLOSURE_AUDIT.json
          echo "::warning::ELF dependency closure passed CI only. Boot on Android ARM64 is NOT VERIFIED."
      - name: Upload runtime candidate and audits (NOT an official release)
        uses: actions/upload-artifact@v4
        with:
          name: QEMU-ANDROID-NATIVE-DEPENDENCY-CANDIDATE-UNTESTED
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            native-runtime-audit/CLOSURE_AUDIT.json
            native-runtime-audit/STAGING_AUDIT.json
            native-runtime-audit/FIRMWARE-SHA256SUMS
          retention-days: 7
          if-no-files-found: error
