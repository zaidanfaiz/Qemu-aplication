plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.zaidan.qemu'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.zaidan.qemu'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0-native-research'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    // Android's linker needs QEMU in nativeLibraryDir, not inside app data.
    packaging {
        jniLibs { useLegacyPackaging true }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
