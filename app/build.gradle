plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.zaidan.qemu'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.zaidan.qemu'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.9.0-rom-import-lab'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    // Android's linker needs QEMU in nativeLibraryDir, not inside app data.
    packaging {
        jniLibs {
            useLegacyPackaging true
            // PIE executables are intentionally stored under lib*.so names.
            // Do not run llvm-strip on these staged executable payloads.
            keepDebugSymbols += ['**/libqemu-system-x86_64.so', '**/libqemu-system-aarch64.so']
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
